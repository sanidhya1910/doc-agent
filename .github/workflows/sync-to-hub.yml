name: Sync to Hugging Face hub

on:
  push:
    branches: [main]
  # allow running manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Check the token is set
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is not set. Add it under Settings -> Secrets" \
                 "and variables -> Actions -> Repository secrets."
            exit 1
          fi

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # HEAD:main, not main -- actions/checkout only creates the triggering
        # branch locally, so a bare "main" refspec fails on manual dispatch
        # from any other branch. HEAD works for both triggers.
        run: |
          git push --force \
            "https://sanidhya1910:$HF_TOKEN@huggingface.co/spaces/sanidhya1910/doc-agent" \
            HEAD:main
